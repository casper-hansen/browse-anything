[project]
name = "browse-anything"
version = "0.2.0"
description = "A browser for agents that gets through bot walls: Playwright MCP's tools on a sandboxed, stealthy Chrome that passes Cloudflare, Turnstile and Anubis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "wreq==0.13.0",
    "mcp>=2.3.0",
    "markdownify>=1.2.3",
]

[project.scripts]
browse-anything = "browse_anything.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
